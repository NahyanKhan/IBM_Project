services:
  - type: web
    name: supply-chain-analytics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run MohammedNahyanKhan_SupplyChainAnalytics.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
